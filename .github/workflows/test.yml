name: test
on: [push, pull_request]
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: retry-429
        run: ./retry-429/test_retry.sh
      - name: spring-ai-chat (compile)
        run: mvn -B -q -f spring-ai-chat/pom.xml compile
      - name: stream-sse
        run: |
          pip install -q -r stream-sse/requirements.txt
          ./stream-sse/test_stream.sh
      - name: token-costs
        working-directory: token-costs
        run: |
          pip install -q -r requirements.txt
          npm ci
          python -m unittest -v
