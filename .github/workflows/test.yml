name: test
on: [push, pull_request]
jobs:
  examples:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: retry-429
        run: ./retry-429/test_retry.sh
      - name: spring-ai-chat (compile)
        run: mvn -B -q -f spring-ai-chat/pom.xml compile
      - name: stream-sse
        run: |
          pip install -q -r stream-sse/requirements.txt
          ./stream-sse/test_stream.sh
      - name: token-costs
        working-directory: token-costs
        run: |
          pip install -q -r requirements.txt
          npm ci
          python -m unittest -v
      - name: rag-pgvector
        working-directory: rag-pgvector
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          pip install -q -r requirements.txt
          python -m unittest -v
      - name: tool-calling
        working-directory: tool-calling
        run: |
          pip install -q -r requirements.txt
          python -m unittest -v
      - name: prompt-injection
        working-directory: prompt-injection
        run: |
          python -m unittest -v
          node --test
      - name: mcp-from-openapi
        working-directory: mcp-from-openapi
        run: |
          pip install -q -r requirements.txt
          python -m unittest -v
      - name: ollama-docker
        working-directory: ollama-docker
        run: python -m unittest -v
