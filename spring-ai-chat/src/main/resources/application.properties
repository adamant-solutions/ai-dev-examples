spring.application.name=spring-ai-chat
# Ollama runs locally: https://ollama.com (default port 11434)
spring.ai.ollama.base-url=http://localhost:11434
# Spring AI 2.0 name; spring.ai.ollama.chat.options.model is deprecated
spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.chat.temperature=0.2
# Download the model on first start if it is missing (default: never)
spring.ai.ollama.init.pull-model-strategy=when_missing
